version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MONGODB_URI=${MONGODB_URI}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - HF_API_TOKEN=${HF_API_TOKEN}
      - TRIGUARD_ENV=production
      - TRIGUARD_ALLOWED_ORIGINS=http://localhost:3000,http://localhost,http://localhost:80
    volumes:
      - ./backend/audio_output:/app/audio_output
      - ./backend/nutrition_images:/app/nutrition_images
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
